name: 'Build'
permissions: { }
on:
  push:
    branches: [ '!main' ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 60
    permissions:
      contents: 'read'
    env:
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
    steps:
      - name: 'Checkout'
        timeout-minutes: 1
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup JDK (21)'
        timeout-minutes: 1
        uses: 'actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad' # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21.0.12.1'
      - name: 'Setup JDK (25)'
        timeout-minutes: 1
        uses: 'actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad' # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25.0.4.1'
      - name: 'Setup Gradle'
        timeout-minutes: 10
        uses: 'gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6' # v6.4.0
        with:
          cache-read-only: true
          dependency-graph: 'generate'
      - name: 'Build'
        timeout-minutes: 60
        run: './gradlew assemble'
      - name: 'Upload'
        timeout-minutes: 10
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'Artifacts'
          path: 'build/libs/'
