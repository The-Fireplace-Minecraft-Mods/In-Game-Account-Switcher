name: 'Build (Legacy)'
permissions: { }
on:
  workflow_dispatch:
jobs:
  legacy:
    name: 'Build (Legacy)'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 90
    permissions:
      contents: 'read'
    env:
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
    steps:
      - name: 'Checkout'
        timeout-minutes: 1
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup JDK (17)'
        timeout-minutes: 1
        uses: 'actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78' # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17.0.21'
      - name: 'Setup JDK (21)'
        timeout-minutes: 1
        uses: 'actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78' # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21.0.13'
      - name: 'Setup JDK (25)'
        timeout-minutes: 1
        uses: 'actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78' # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5'
      - name: 'Setup Gradle'
        timeout-minutes: 10
        uses: 'gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c' # v6.4.1
        with:
          cache-read-only: true
          dependency-graph: 'generate'
      - name: 'Build (Legacy)'
        timeout-minutes: 90
        run: './gradlew -Dru.vidtu.ias.legacy=true assemble'
      - name: 'Upload'
        timeout-minutes: 10
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'Artifacts'
          path: 'build/libs/'
